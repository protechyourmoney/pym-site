name: daily-pym-news
on:
  schedule:
    - cron: '30 23 * * *'   # 每日 23:30 UTC = 香港早上 07:30
  workflow_dispatch:          # 亦可喺 GitHub 手動 Run
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install anthropic feedparser
      - name: Run news updater
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/daily_news.py
      - name: Commit & push if changed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "PYM Auto"
            git config user.email "wealth@ccstudio.media"
            git add index.html
            git commit -m "auto: 每日 PYM 新聞 (GitHub Actions)"
            git push
          else
            echo "No changes today"
          fi
